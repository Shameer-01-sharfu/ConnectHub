{% extends "reels/base_reels.html" %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">
    <div class="card bg-dark text-white p-4" style="max-width:420px;width:100%;">
        <h5 class="mb-3">Delete Reel</h5>
        <p class="text-white-50">Are you sure you want to delete this reel? This action cannot be undone.</p>

        {% if reel.video %}
        <video src="{{ reel.video.url }}" class="w-100 rounded mb-3" style="max-height:220px;object-fit:cover;" muted></video>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2 justify-content-end">
                <a href="{% url 'reels' %}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-danger">Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
